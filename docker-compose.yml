services:
  myvs:
    build: .
    image: myvs:local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      MYVS_HOST: 0.0.0.0
      MYVS_PORT: 8000
      MYVS_AUTO_BROWSER: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    restart: "no"
