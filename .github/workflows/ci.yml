name: CI

on:
  push:
    branches:
      - main
      - myvs-fixes-*
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "uvicorn[standard]" sqlmodel pydantic-settings python-multipart psutil httpx numpy soundfile pyyaml imageio-ffmpeg
      - name: Compile Python sources
        run: python -m compileall -q backend tests run.py
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend
